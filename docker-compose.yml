services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-fastapi
    restart: unless-stopped
    # Host networking keeps the port on 127.0.0.1:8880 for the reverse proxy.
    # On Docker Desktop (no host networking) drop this and publish:
    #   ports: ["8880:8880"]
    network_mode: host
    environment:
      USE_GPU: "false"
      DEVICE: cpu
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8880/health"]
      interval: 30s
      timeout: 5s
      retries: 5
